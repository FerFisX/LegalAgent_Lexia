[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    unit: Pruebas unitarias (rápidas, sin dependencias externas)
    integration: Pruebas de integración (requieren DB de test)
    regression: Pruebas de regresión (comportamientos críticos)
    usability: Pruebas de usabilidad (flujos completos de usuario)

# Opciones por defecto
addopts =
    -v
    --tb=short
    --no-header

# No mostrar warnings de deprecación de librerías externas
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
